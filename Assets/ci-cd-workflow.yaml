# .github/workflows/deploy.yml
# CI workflow: lint/typecheck/build on every PR, Vercel handles the actual
# preview/production deploys via its native Git integration (no deploy step
# needed here if the Vercel GitHub App is connected to this repo).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Server-only secrets (service role key, Razorpay, Shiprocket) are
          # intentionally NOT needed at build time - only at runtime on Vercel.

  # Vercel's GitHub integration auto-deploys:
  #   - every PR -> unique Preview URL (uses Preview env vars set in Vercel)
  #   - every merge to main -> Production deploy (uses Production env vars)
  # No explicit deploy job required unless deploying outside Vercel's Git integration.
