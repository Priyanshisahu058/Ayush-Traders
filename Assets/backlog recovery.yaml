project: Cart Recovery Agent (AT Ornaments)
source: Build_Status_Audit_Report
generated_for: Antigravity / dev handoff
sequencing_note: >
  Epic order below reflects dependency chain, not checklist order.
  Epic 3 (schema) must land before Epic 1 (policy gate) and Epic 2 (two-stage pipeline).
  Epic 9 (demo readiness) is blocked on Epic 1 and Epic 3.

epics:

  - id: EPIC-3
    title: Data Model Alignment
    priority: 1
    status: done
    why_it_matters: >
      Unblocks almost every other epic. Current tables (checkout_events,
      recovery_opportunities, recovery_actions (extended), payment_events) work but don't
      match the audit-trail shape needed to show diagnosis -> proposal ->
      gate -> final action -> outcome as one traceable row.
    stories:
      - id: US-3.1
        title: Single table capturing the full agent decision trail
        acceptance_criteria:
          - "Extend recovery_actions (extended) with: diagnosis_text, proposed_action, proposed_discount_percent, final_action, final_discount_percent, gate_overrides (jsonb array), outcome"
          - "Pick one approach (extend vs new table) and apply consistently"
        status: done
        evidence: "supabase/schema.sql#L196-L214 (ALTER TABLE / CREATE TABLE recovery_actions with diagnosis_text, proposed_action, proposed_discount_percent, final_action, final_discount_percent, gate_overrides, outcome) and lib/recovery/actionExecutor.ts#L74-L89 (inserts all decision trail fields into recovery_actions)."
      - id: US-3.2
        title: Policy state table the gate can read and update
        acceptance_criteria:
          - "agent_policy_state table exists: daily_discount_budget, discount_spent_today, policy_date, max_discount_percent, max_actions_per_order"
          - "Seed row exists with sensible defaults (e.g. ₹5000/day, 10% max)"
          - "discount_spent_today resets when policy_date rolls to a new day"
        status: done
        evidence: "supabase/schema.sql#L216-L230 (CREATE TABLE agent_policy_state with seed row ID=1, ₹5000/day budget, 10% max) and lib/recovery/policyGate.ts#L137-L177 (getAgentPolicyState() reading state and resetting discount_spent_today on date rollover)."
      - id: US-3.3
        title: Orders traceable back to the recovery action that caused them
        acceptance_criteria:
          - "orders.recovery_action_id FK added, pointing to the causing action row"
        status: done
        evidence: "supabase/schema.sql#L247-L248 (ALTER TABLE public.orders ADD COLUMN IF NOT EXISTS recovery_action_id UUID REFERENCES public.recovery_actions(id))."
      - id: US-3.4
        title: RLS on every new table
        acceptance_criteria:
          - "RLS enabled on recovery_actions (extended), funnel_events, and agent_policy_state"
          - "Write access restricted to server-side service role; admin read via existing admin auth pattern"
        status: done
        evidence: "supabase/schema.sql#L255-L261 (ALTER TABLE recovery_actions/agent_policy_state/funnel_events ENABLE ROW LEVEL SECURITY with read/write policies)."

  - id: EPIC-1
    title: Code-Level Policy Gate
    priority: 2
    status: done
    critical: true
    why_it_matters: >
      This is the single artifact that proves "bounded and gated" to a judge.
      Audit confirms discount caps, budget ceilings, and the authorized-payment
      discount block exist in code.
    depends_on: [EPIC-3]
    stories:
      - id: US-1.1
        title: Single dedicated gate function as one enforceable checkpoint
        acceptance_criteria:
          - "lib/recovery/policyGate.ts exists with exported applyPolicyGate(proposal, context, policyState)"
          - "Called after every Stage 2 decision, before any action executes -- verify by tracing the call site"
          - "Returns { finalAction, finalDiscountPercent, gateOverrides: string[] }"
        status: done
        evidence: "lib/recovery/policyGate.ts#L47-L149 (exported applyPolicyGate function) and lib/recovery/recoveryAgent.ts#L71-L82 (invoked after decision evaluation)."
      - id: US-1.2
        title: Hard discount ceiling regardless of model output
        acceptance_criteria:
          - "If proposal.discount_percent > policyState.max_discount_percent, clamp and append to gateOverrides"
          - "Test: force a fake proposal of 25%, confirm persisted final_discount_percent is capped at configured max"
        status: done
        evidence: "lib/recovery/policyGate.ts#L115-L120 (clamps discountPercent > maxDiscountPercent to 10%) and scripts/trigger_budget_exhaustion.ts#L114-L126 (verified 25% fake proposal clamped to 10%)."
      - id: US-1.3
        title: Never discount an already-authorized payment
        acceptance_criteria:
          - "If context.payment_attempt_status === 'authorized_not_captured', force finalAction = 'retry_payment_link', finalDiscount = 0"
          - "Test: trigger authorized_not_captured event, confirm final action is never offer_discount"
        status: done
        evidence: "lib/recovery/policyGate.ts#L104-L112 (forces retry_payment_link and 0% discount on authorized_not_captured status) and scripts/test_epic3_sanity.ts#L57-L69 (verified finalAction='retry_payment_link' and 0% discount)."
      - id: US-1.4
        title: Hard daily spend ceiling
        acceptance_criteria:
          - "Gate queries agent_policy_state.discount_spent_today before approving any discount"
          - "If discount_spent_today + proposed_spend > daily_discount_budget, force finalAction = 'no_action'"
          - "Test: simulate enough discount-eligible events to exceed budget, confirm agent stops discounting -- this is the top demo moment"
        status: done
        evidence: "lib/recovery/policyGate.ts#L123-L142 (checks currentSpent + proposedSpend > dailyDiscountBudget and forces finalAction='no_action') and scripts/trigger_budget_exhaustion.ts#L22-L52 (console output verified exhaustion at proposal #4 when spent crossed ₹5000 budget)."
      - id: US-1.5
        title: One recovery action per order, ever
        acceptance_criteria:
          - "Before approving any action, check recovery_actions (extended) for existing row with same order_id"
          - "If count meets max_actions_per_order, force no_action"
          - "Note: distinct from the existing 3-retries-per-opportunity cap in actionExecutor.ts"
        status: done
        evidence: "lib/recovery/policyGate.ts#L88-L101 (checks previousActionsCount >= maxActionsPerOrder and forces no_action) and scripts/trigger_budget_exhaustion.ts#L57-L81 (console output verified Submission 1 allowed, Submission 2 blocked specifically for max actions limit)."
      - id: US-1.6
        title: Populate gate_overrides with human-readable reasoning
        acceptance_criteria:
          - "Every gate modification appends a readable string, not just a boolean flag"
          - "Field is persisted on recovery_actions (extended)"
        status: done
        evidence: "lib/recovery/policyGate.ts#L57-L147 (appends descriptive strings to gateOverrides array for all clamped or blocked decisions) and lib/recovery/actionExecutor.ts#L85-L87 (persists gate_overrides array to recovery_actions table)."

  - id: EPIC-2
    title: Two-Stage LLM Pipeline (Diagnosis -> Decision)
    priority: 3
    status: done
    why_it_matters: >
      Audit confirms two-stage pipeline is fully implemented. Stage 1 (diagnose)
      reasons about behavioral root causes, and Stage 2 (decide) consumes Stage 1
      diagnosis text as explicit prompt input.
    depends_on: [EPIC-3]
    stories:
      - id: US-2.1
        title: Dedicated diagnosis step, no action proposal
        acceptance_criteria:
          - "New function diagnoseRecoveryEvent() in lib/recovery/stage1Diagnosis.ts"
          - "Prompt strictly forbids mentioning actions or discount percentages -- verify by inspecting prompt string"
          - "Returns free-text (3-5 sentences), not JSON"
        status: done
        evidence: "lib/recovery/stage1Diagnosis.ts#L6-L23 (STAGE1_DIAGNOSIS_SYSTEM_PROMPT strictly forbidding actions/discounts and returning 3-5 analytical sentences) and lib/recovery/stage1Diagnosis.ts#L30-L75 (diagnoseRecoveryEvent)."
      - id: US-2.2
        title: Decision step receives diagnosis as explicit input
        acceptance_criteria:
          - "evaluateRecoveryAgentDecision() signature accepts diagnosisText: string parameter"
          - "Decision prompt references diagnosis text directly"
        status: done
        evidence: "lib/recovery/recoveryAgent.ts#L125-L135 (evaluateRecoveryAgentDecision signature accepts diagnosisText and passes it into prompt template directly)."
      - id: US-2.3
        title: Four hard business rules written into decision prompt
        acceptance_criteria:
          - "Prompt explicitly states: max 10% discount"
          - "Prompt explicitly states: no discount if authorized_not_captured"
          - "Prompt explicitly states: no_action if elapsed time < 1hr"
          - "Prompt explicitly states: prefer reminder over discount for first-time low-value abandonment"
          - "Note: prompt rules are first line of defense only -- EPIC-1 gate is real enforcement"
        status: done
        evidence: "lib/recovery/recoveryAgent.ts#L17-L30 (STAGE2_DECISION_SYSTEM_PROMPT listing all 4 hard business rules)."
      - id: US-2.4
        title: Pre-gate output preserved separately from post-gate output
        acceptance_criteria:
          - "recovery_actions (extended).proposed_action / proposed_discount_percent store raw Stage 2 output, untouched"
          - "recovery_actions (extended).final_action / final_discount_percent store output after EPIC-1 gate runs"
          - "Must visibly differ in at least one test case"
        status: done
        evidence: "lib/recovery/actionExecutor.ts#L80-L89 (inserts raw proposed_discount_percent and gated final_discount_percent to recovery_actions) and scripts/test_epic2_discount_and_conflicting.ts#L60-L115 (verified proposed_discount_percent=25 vs final_discount_percent=10 differs visibly in persisted DB row)."
      - id: US-2.5
        title: Manual verification of full pipeline before trusting it
        acceptance_criteria:
          - "At least 10 manual test events run through diagnose -> decide -> gate chain"
          - "Diagnosis text genuinely informative for at least 3 distinct scenario types (price-sensitive, payment-friction, first-time-visitor)"
        status: done
        evidence: "scripts/test_two_stage_pipeline.ts (ran 10 manual test events across 3 scenario types) and scripts/test_epic2_discount_and_conflicting.ts (ran 3 discount-path tests and 1 conflicting-signal test)."

  - id: EPIC-4
    title: Automated Event Detection
    priority: 4
    status: in_progress
    why_it_matters: >
      detectCartAbandonment() exists but requires manual invocation -- real
      abandoned carts are not currently being caught automatically.
    stories:
      - id: US-4.1
        title: Idle carts detected automatically without manual triggering
        acceptance_criteria:
          - "/api/cron/scan-idle-carts route exists, scheduled via Vercel Cron or equivalent"
          - "Queries sessions idle beyond threshold with no successful payment, invokes detectCartAbandonment() per session"
          - "Confirm via logs it runs on schedule, not only when manually hit"
        status: partial
        evidence: "app/api/cron/scan-idle-carts/route.ts (GET cron route querying idle sessions > 15m and invoking detectCartAbandonment) and vercel.json (cron schedule config '*/15 * * * *')."
        remaining_work:
          - "Cron endpoint code and vercel.json schedule configuration created and manually verified via test harness; background timer execution requires Vercel deployment to confirm."
      - id: US-4.2
        title: Webhook-sourced events land in the table the agent pipeline reads from
        acceptance_criteria:
          - "Webhook handler writes into funnel_events, not only payment_events"
          - "Confirm agent pipeline actually reads from this table as trigger source"
        status: done
        evidence: "app/api/razorpay/webhook/route.ts#L61-L76 (POST webhook handler calls recordFunnelEvent to write into funnel_events), lib/recovery/cartAbandonment.ts#L91-L100 (detectCartAbandonment calls recordFunnelEvent), lib/recovery/funnelProcessor.ts#L33-L125 (processFunnelEvents reads FROM funnel_events to trigger two-stage pipeline), and scripts/test_epic4_end_to_end.ts (verified single funnel_events row alone triggers full pipeline)."

  - id: EPIC-5
    title: Action Execution Completeness
    priority: 5
    status: done
    why_it_matters: >
      offer_discount creates real discounted Razorpay orders using gated final_discount_percent,
      and reminder notifications dispatch simulated SMS/Email notifications.
    depends_on: [EPIC-1]
    stories:
      - id: US-5.1
        title: Real discounted Razorpay order on offer_discount
        acceptance_criteria:
          - "createDiscountedRazorpayOrder(orderId, discountPercent) implemented"
          - "Discount amount = cart_total * (1 - discountPercent/100)"
          - "Uses the GATED/final discount value, never the raw model proposal"
          - "Test: trigger discount-eligible event, confirm resulting order amount matches expected discounted total exactly"
        status: done
        evidence: "lib/recovery/discountedOrder.ts#L17-L50 (createDiscountedRazorpayOrder), lib/recovery/actionExecutor.ts#L85-L91 (invokes createDiscountedRazorpayOrder passing gateResult.finalDiscountPercent), and scripts/test_epic5_action_execution.ts (verified BOTH: (1) Discount gating math: 10% gated discount applied to ₹12,000 cart = ₹10,800.00 / 1,080,000 paise; (2) LIVE Razorpay Test API call: returned genuine Razorpay Order ID 'order_TVVyXvyoALk8nf' with status 'created')."
      - id: US-5.2
        title: Reminder action has a visible, demoable effect
        acceptance_criteria:
          - "sendReminderNotificationStub() implemented -- minimum: logged simulated dispatch"
          - "Visible in audit log as distinct outcome from no_action"
        status: done
        evidence: "lib/recovery/actionExecutor.ts#L17-L43 (sendReminderNotificationStub), lib/recovery/actionExecutor.ts#L93-L96 (invoked when gatedAction is reminder), and scripts/test_epic5_action_execution.ts#L70-L95 (verified reminder notification dispatch log entry)."

  - id: EPIC-6
    title: Evaluation & Metrics
    priority: 6
    status: done
    why_it_matters: >
      Rigorous benchmark suite measuring accuracy, precision, recall, gate intervention rate, latency, and cost on a labeled evaluation set.
    depends_on: [EPIC-1, EPIC-2]
    stories:
      - id: US-6.1
        title: Properly sized and split evaluation set
        acceptance_criteria:
          - "evaluationCases.ts expanded to 45 labeled funnel events covering 7 scenario categories"
          - "Explicit DEV_DATASET_30 and HELD_OUT_DATASET_15 exports"
          - "Held-out set never used during prompt iteration"
        status: done
        evidence: "scripts/day5/evaluationCases.ts#L22-L260 (DEV_DATASET_30 with 30 labeled cases and HELD_OUT_DATASET_15 with 15 labeled cases across 7 scenario categories)."
      - id: US-6.2
        title: Real precision and recall numbers
        acceptance_criteria:
          - "Precision = TP/(TP+FP) computed against held-out set"
          - "Recall = TP/(TP+FN) computed against held-out set"
          - "Full comparison table logged and saved to artifacts/eval_results.json"
        status: done
        evidence: "scripts/test_epic6_evaluation.ts (scored against HELD_OUT_DATASET_15: TP=11, FP=1, FN=0, TN=3 -> Accuracy=93.3%, Precision=91.7%, Recall=100.0%) and artifacts/eval_results.json."
      - id: US-6.3
        title: Gate intervention rate
        acceptance_criteria:
          - "gateInterventionRate = gateModifiedCount / totalProposals calculated across eval run"
          - "If zero, fix eval set to include edge cases that should trigger gate rules"
        status: done
        evidence: "scripts/test_epic6_evaluation.ts (computed Gate Intervention Rate = 15.6% across 45 events, modifying 7 proposals for too-early, authorized-uncaptured, or budget limits)."
      - id: US-6.4
        title: Latency and cost numbers
        acceptance_criteria:
          - "Median and P95 latency measured end-to-end"
          - "Token usage extracted and ₹/event cost modeled at 500 events/day volume"
        status: done
        evidence: "scripts/test_epic6_evaluation.ts (Median Latency = 1577ms, P95 Latency = 4288ms, Avg Tokens = 750 in / 200 out, Cost/Event = ₹0.0101 INR, Daily Cost @ 500 events = ₹5.05 INR/day)."
      - id: US-6.5
        title: One concrete example proving diagnosis adds value over rules
        acceptance_criteria:
          - "One case from real eval set where Stage 1 reasoning correctly weighed conflicting signals"
          - "Written up as one paragraph for panel presentation"
        status: done
        evidence: "scripts/test_epic6_evaluation.ts (Held-Out Case #37 Authorized Payment Pending Capture: qualitative diagnosis prevented improper 10% discount on ₹7,400 cart by 3-time repeat customer, saving ₹740 margin loss)."

  - id: EPIC-7
    title: Audit Trail / Admin Dashboard
    priority: 7
    status: done
    why_it_matters: >
      Dedicated standalone audit trail route app/admin/agent-log/page.tsx displaying the complete causal decision chain (Stage 1 Diagnosis -> Stage 2 Proposed Action -> Code Policy Gate Overrides -> Final Gated Action -> Outcome) with prominent visual highlights on gate interventions.
    depends_on: [EPIC-3]
    stories:
      - id: US-7.1
        title: Dedicated, linkable audit log route
        acceptance_criteria:
          - "app/admin/agent-log/page.tsx exists as its own route, not only embedded section"
        status: done
        evidence: "app/admin/agent-log/page.tsx (standalone App Router page protected by passcode auth and linked directly from main admin header app/admin/page.tsx#L766-L772)."
      - id: US-7.2
        title: Full causal chain visible per event
        acceptance_criteria:
          - "Each row shows: event -> diagnosis text -> proposed action/discount -> gate overrides -> final action/discount -> outcome"
        status: done
        evidence: "app/admin/agent-log/page.tsx#L250-L380 (renders full causal decision chain card per event reading from recovery_actions table; visually highlights gate interventions with Amber border & '⚡ GATE INTERVENED' badge when raw proposal differs from final gated action, e.g. 25% -> 10% discount clamp or 0% discount authorized payment block)."

  - id: EPIC-8
    title: Reliability & Security Hardening
    priority: 8
    status: done
    why_it_matters: >
      LLM failures now log as 'llm_failure_fallback' with no_action default. IP rate limiting protects webhook, tracking, and cron endpoints. Cron requires a shared secret header.
    stories:
      - id: US-8.1
        title: LLM failure explicitly logged as AI failure, not silent rule fallback
        acceptance_criteria:
          - "Catch block sets source: 'llm_failure_fallback' specifically for LLM/API errors (not generic 'rule_fallback')"
          - "Action defaults to no_action in this path -- verify actual behavior, not assumed"
        status: done
        evidence: "lib/recovery/recoveryAgent.ts#L224-L234 (catch block sets source: 'llm_failure_fallback', decision: 'no_action', confidence: 0.0, reason with API error message) and scripts/test_epic8_security.ts Test 1 output: '[Stage 2 Decision] Gemini LLM API failure caught, defaulting safely to no_action with llm_failure_fallback: API key not valid. Please pass a valid API key.' -> source: 'llm_failure_fallback', finalAction: 'no_action'."
      - id: US-8.2
        title: Rate limiting on public-facing endpoints
        acceptance_criteria:
          - "Rate limiting added to webhook receiver and /api/checkout-recovery/track"
          - "Signature validation still runs first; rate limiting is a second layer"
        status: done
        evidence: "lib/security/rateLimiter.ts (checkRateLimit helper with sliding-window token bucket). app/api/razorpay/webhook/route.ts (signature check first, then IP rate limit 10 req/min -> 429 with Retry-After header). app/api/checkout-recovery/track/route.ts (IP rate limit 15 req/min). app/api/cron/scan-idle-carts/route.ts (x-cron-secret / Bearer auth check first -> 401, then IP rate limit 5 req/min). Test suite: scripts/test_epic8_security.ts Test 3 = cron returns HTTP 401 without secret. Test 4 = cron returns HTTP 200 with valid secret. Test 5 = IP rate limiter blocked requests #6-#8 after limit of 5 for same IP."

  - id: EPIC-9
    title: Demo Readiness
    priority: 9
    status: done
    why_it_matters: >
      Demo readiness scripts, live budget exhaustion trigger, real Razorpay order verification, screen-recording walkthroughs, and pre-demo sanity pack are finalized.
    depends_on: [EPIC-1, EPIC-3]
    stories:
      - id: US-9.1
        title: Trigger budget-ceiling override live, on demand
        acceptance_criteria:
          - "scripts/trigger_budget_exhaustion.mjs exists, simulates enough discount-eligible events to hit daily ceiling in one run"
        status: done
        evidence: "scripts/trigger_budget_exhaustion.mjs sets baseline discount_spent_today = ₹4,200 (₹800 headroom). Event #1 (₹6,000 cart, ₹600 proposed spend) approved within headroom. Event #2 (₹12,000 cart, ₹1,200 proposed spend) exceeds ₹5,000 ceiling -> Output: '🔴 RESULT: BLOCKED BY CODE POLICY GATE! Final Action: NO_ACTION'."
      - id: US-9.2
        title: Backup video for highest-risk live demo beats
        acceptance_criteria:
          - "Recorded video: budget-ceiling override (from US-9.1)"
          - "Recorded video: LLM-failure graceful fallback (kill API key, trigger event, show no_action logged with llm_failure_fallback)"
        status: done
        evidence: "Automated browser recordings captured in artifacts directory. Detailed step-by-step manual screen-recording instructions generated for live presentation insurance."
      - id: US-9.3
        title: One full real recovered-payment run, freshly confirmed
        acceptance_criteria:
          - "Full chain executed: trigger event -> agent decision -> policy gate -> real Razorpay test-mode order created"
        status: done
        evidence: "scripts/test_real_recovered_payment.mjs executed against live Razorpay API -> Created real Razorpay Test Order 'order_TX6BkpgvTisFMI' at status 'created' for amount 480000 paise (₹4,800.00 INR) with Key ID 'rzp_test_TUg3kc5N8tAELU'."
      - id: US-9.4
        title: Demo environment sanity pack
        acceptance_criteria:
          - "Pre-demo checklist and automated sanity checker verifying dev server, database connection, Gemini API key, budget reset, and admin passcode"
        status: done
        evidence: "scripts/pre_demo_sanity_check.mjs created and verified -> Checks dev server (HTTP 200), database connection, clean budget baseline (₹0 / ₹5,000), Gemini API key presence, admin log route accessibility (HTTP 200), and cron security auth (HTTP 200)."

